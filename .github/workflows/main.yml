name: Main

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest tests

      - name: Check typing
        run: uv run mypy

  airflow-dags:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment (with airflow extra)
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          extras: "--extra airflow"

      - name: Parse DAGs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python -m pytest tests/orchestrators/test_airflow_dags.py -v

  dagster-definitions:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment (with dagster extra)
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          extras: "--extra dagster"

      - name: Validate Dagster definitions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python -m pytest tests/orchestrators/test_dagster_definitions.py -v
